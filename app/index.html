<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />

    <!-- SEO -->
    <title>Welcome Book — digitalni vodič za goste vašeg apartmana</title>
    <meta
      name="description"
      content="Welcome Book je elegantan digitalni vodič za goste privatnog smještaja. Gost skenira QR kod i odmah vidi Wi-Fi, prijavu/odjavu, kućni red, plaže, restorane i lokalne savjete na svom jeziku — uz nježan podsjetnik da ostavi recenziju. Bez aplikacije, bez prijave."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.welcomebook.eu/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Welcome Book" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:url" content="https://www.welcomebook.eu/" />
    <meta property="og:title" content="Welcome Book — digitalni vodič za goste vašeg apartmana" />
    <meta
      property="og:description"
      content="Gost skenira QR kod i vidi sve na jednom mjestu — Wi-Fi, kućni red, plaže, restorane i lokalne savjete na svom jeziku, uz nježan podsjetnik da ostavi recenziju. Bez aplikacije."
    />
    <meta property="og:image" content="https://www.welcomebook.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Welcome Book — digitalni vodič za goste vašeg apartmana" />
    <meta
      name="twitter:description"
      content="Gost skenira QR kod i vidi sve na jednom mjestu — Wi-Fi, kućni red, plaže, restorane i lokalne savjete na svom jeziku, uz nježan podsjetnik da ostavi recenziju."
    />
    <meta name="twitter:image" content="https://www.welcomebook.eu/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Welcome Book",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.welcomebook.eu/",
        "description": "Digitalni vodič za goste privatnog smještaja: QR kod vodi gosta na stranicu s Wi-Fi-jem, kućnim redom, plažama, restoranima i lokalnim savjetima na njegovom jeziku, uz podsjetnik za recenziju.",
        "inLanguage": ["hr", "en", "de", "it", "sl", "pl", "cs", "hu", "sk"],
        "offers": {
          "@type": "Offer",
          "price": "99",
          "priceCurrency": "EUR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
